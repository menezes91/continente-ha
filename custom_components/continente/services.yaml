enviar_lista:
  name: Enviar lista para o carrinho
  description: >-
    Põe no carrinho do Continente os itens da lista do Cookidoo que já têm
    produto escolhido e ainda não estão marcados como comprados.
  fields:
    marcar_no_cookidoo:
      name: Marcar no Cookidoo
      description: >-
        Passa para "Itens que tem" os que entraram mesmo no carrinho.
      default: true
      selector:
        boolean:

adicionar_produto:
  name: Adicionar produto
  description: Acrescenta um produto ao carrinho.
  fields:
    produto:
      name: Produto
      description: O id do produto, o URL, ou o slug.
      required: true
      example: "2597619"
      selector:
        text:
    quantidade:
      name: Quantidade
      description: >-
        Na unidade de venda do produto — quilos num produto a peso.
        É ajustada ao mínimo e ao múltiplo que o site exigir.
      default: 1
      selector:
        number:
          min: 0.1
          max: 99
          step: 0.1
          mode: box

remover_produto:
  name: Remover produto
  description: Tira um produto do carrinho.
  fields:
    produto:
      name: Produto
      description: O id do produto, o URL, ou o slug.
      required: true
      example: "2597619"
      selector:
        text:

registar_precos:
  name: Registar preços de hoje
  description: >-
    Guarda o preço atual dos produtos que compras e dos que mapeaste.

esvaziar_carrinho:
  name: Esvaziar carrinho
  description: Remove tudo o que está no carrinho do Continente.
