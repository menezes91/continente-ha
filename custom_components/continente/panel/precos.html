<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preços · Continente</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --ink: #16181c; --muted: #6b7280;
    --line: #e3e3df; --accent: #e30613;
    --surface-1: #ffffff;          /* superfície do gráfico */
    --series-1: #2a78d6;           /* o preço — a série que importa */
    --context: #8b8f96;            /* o PVPR — contexto, de-emphasis */
    --grid: #e8e8e4;
    --ok: #0f7b3d; --ok-bg: #eaf6ee; --up: #c2410c;
    --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --card: #1f2124; --ink: #e9eaec; --muted: #9aa0a6;
      --line: #303236; --surface-1: #1f2124; --series-1: #3987e5;
      --context: #7c8288; --grid: #2b2d31;
      --ok: #4ade80; --ok-bg: #14301f; --up: #fb923c; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a; --card: #1f2124; --ink: #e9eaec; --muted: #9aa0a6;
    --line: #303236; --surface-1: #1f2124; --series-1: #3987e5;
    --context: #7c8288; --grid: #2b2d31;
    --ok: #4ade80; --ok-bg: #14301f; --up: #fb923c; --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--card);
           border-bottom: 1px solid var(--line); padding: 14px 20px;
           display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 650; }
  h1 span { color: var(--accent); }
  a.nav { color: var(--muted); text-decoration: none; font-size: 14px; }
  a.nav:hover { color: var(--ink); }
  .spacer { flex: 1; }
  button { font: inherit; cursor: pointer; border-radius: 8px; padding: 7px 13px;
           border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent);
                   color: #fff; font-weight: 600; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px;
         display: grid; grid-template-columns: 330px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: var(--radius); box-shadow: var(--shadow); }
  .side { padding: 12px; max-height: 78vh; overflow: auto; }
  .side input { width: 100%; font: inherit; padding: 8px 10px; margin-bottom: 10px;
                border: 1px solid var(--line); border-radius: 8px;
                background: var(--bg); color: var(--ink); }
  .prod { display: flex; align-items: center; gap: 10px; padding: 9px 10px;
          border-radius: 8px; cursor: pointer; width: 100%; text-align: left;
          border: 1px solid transparent; background: none; color: var(--ink); }
  .prod:hover { background: var(--bg); }
  .prod[aria-current="true"] { border-color: var(--series-1); background: var(--bg); }
  .prod .n { flex: 1; min-width: 0; font-size: 14px; }
  .prod .n small { color: var(--muted); display: block; }
  .pill { font-size: 11px; padding: 2px 7px; border-radius: 20px; white-space: nowrap;
          background: var(--ok-bg); color: var(--ok); }
  .pill.up { background: transparent; color: var(--up); border: 1px solid var(--up); }
  .pill.flat { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .detail { padding: 18px 20px 20px; }
  .figure-title { font-size: 16px; font-weight: 650; margin: 0; }
  .figure-sub { color: var(--muted); font-size: 13px; margin: 2px 0 16px; }
  .kpis { display: flex; gap: 26px; flex-wrap: wrap; margin-bottom: 6px; }
  .kpi .label { font-size: 12px; color: var(--muted); }
  .kpi .value { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums;
                line-height: 1.2; }
  .kpi .value.small { font-size: 17px; font-weight: 600; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted);
            margin: 14px 0 2px; }
  .legend i { display: inline-block; width: 16px; height: 0; vertical-align: middle;
              margin-right: 6px; border-top: 2px solid var(--series-1); }
  .legend i.ctx { border-top: 2px dashed var(--context); }
  figure { margin: 0; }
  .chart-wrap { position: relative; overflow-x: auto; overflow-y: hidden; }
  svg { display: block; touch-action: none; }
  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis text { fill: var(--muted); font-size: 11px; }
  .serie { fill: none; stroke: var(--series-1); stroke-width: 2;
           stroke-linejoin: round; stroke-linecap: round; }
  .ctxline { fill: none; stroke: var(--context); stroke-width: 2;
             stroke-dasharray: 5 4; }
  .dot { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
  .crosshair { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .endlabel { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .tip { position: absolute; left: 0; top: 0; pointer-events: none; background: var(--card);
         border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
         font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.18);
         opacity: 0; transition: opacity .1s; white-space: nowrap; }
  .tip.on { opacity: 1; }
  .tip b { font-size: 14px; }
  .note { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
          padding: 10px 12px; font-size: 13px; color: var(--muted); margin-top: 16px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 10px; }
  th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 550; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .msg { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
         background: var(--card); margin-bottom: 14px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Preços <span>·</span> Continente</h1>
  <a class="nav" href="/api/continente/panel/app.html">← lista do Cookidoo</a>
  <div class="spacer"></div>
  <span id="stats" class="nav"></span>
  <button id="snap" class="primary">Registar preços de hoje</button>
</header>

<main>
  <aside class="card side">
    <input id="filter" placeholder="filtrar produtos…" autocomplete="off">
    <div id="list"><div class="empty">a carregar…</div></div>
  </aside>

  <section class="card detail" id="detail">
    <div class="empty">Escolhe um produto à esquerda.</div>
  </section>
</main>

<script>
const API = '/api/continente';   // as rotas da integração
const $ = s => document.querySelector(s);
let PRODUCTS = [], CURRENT = null;

const api = async (p, o = {}) => {
  const r = await fetch(API + p, { headers: { 'Content-Type': 'application/json' }, ...o });
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(b.detail || `${r.status}`);
  return b;
};
const eur = v => v == null ? '—' : v.toFixed(2).replace('.', ',') + '€';
const esc = s => (s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dayLabel = d => d.slice(8, 10) + '/' + d.slice(5, 7);

async function loadList() {
  try {
    const r = await api('/prices/tracked');
    PRODUCTS = r.products;
    const s = r.stats;
    $('#stats').textContent = s.produtos
      ? `${s.produtos} produtos · ${s.dias} ${s.dias === 1 ? 'dia' : 'dias'} desde ${s.desde}`
      : 'sem registos';
    renderList();
    if (PRODUCTS.length && !CURRENT) select(PRODUCTS[0].pid);
  } catch (e) {
    $('#list').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function renderList() {
  const q = $('#filter').value.trim().toLowerCase();
  const rows = PRODUCTS.filter(p => !q || (p.nome || '').toLowerCase().includes(q));
  if (!rows.length) {
    $('#list').innerHTML = `<div class="empty">${PRODUCTS.length
      ? 'Nada corresponde.' : 'Ainda não há registos. Carrega em “Registar preços de hoje”.'}</div>`;
    return;
  }
  $('#list').innerHTML = rows.map(p => {
    const v = p.variacao;
    const cls = v == null || v === 0 ? 'flat' : v < 0 ? '' : 'up';
    const txt = v == null || v === 0 ? '—' : (v > 0 ? '+' : '') + v + '%';
    const promo = p.preco_ref ? ` · PVPR ${eur(p.preco_ref)}` : '';
    return `<button class="prod" data-pid="${esc(p.pid)}"
              aria-current="${p.pid === CURRENT}">
      <span class="n">${esc(p.nome || p.pid)}
        <small>${eur(p.preco)}${promo}</small></span>
      <span class="pill ${cls}">${txt}</span>
    </button>`;
  }).join('');
  document.querySelectorAll('.prod').forEach(b =>
    b.onclick = () => select(b.dataset.pid));
}

async function select(pid) {
  CURRENT = pid;
  renderList();
  $('#detail').innerHTML = '<div class="empty">a carregar…</div>';
  try {
    renderDetail(await api('/prices/' + encodeURIComponent(pid)));
  } catch (e) {
    $('#detail').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function renderDetail(d) {
  const pts = d.points;
  const last = pts[pts.length - 1] || {};
  const v = d.variacao;
  const vTxt = v == null || pts.length < 2 ? '—' : (v > 0 ? '+' : '') + v + '%';
  const vColor = v == null || v === 0 || pts.length < 2 ? 'var(--muted)'
    : v < 0 ? 'var(--ok)' : 'var(--up)';
  const desconto = last.preco_ref
    ? Math.round(100 * (1 - last.preco / last.preco_ref)) : null;

  $('#detail').innerHTML = `
    <figure>
      <figcaption>
        <h2 class="figure-title">${esc(d.name || d.pid)}</h2>
        <p class="figure-sub">Preço registado ${pts.length === 1 ? 'hoje'
          : `entre ${pts[0].dia} e ${last.dia}`} · id ${esc(d.pid)}</p>
      </figcaption>

      <div class="kpis">
        <div class="kpi"><div class="label">preço atual</div>
          <div class="value">${eur(d.atual)}</div></div>
        <div class="kpi"><div class="label">variação no período</div>
          <div class="value small" style="color:${vColor}">${vTxt}</div></div>
        <div class="kpi"><div class="label">mínimo registado</div>
          <div class="value small">${eur(d.minimo)}</div></div>
        <div class="kpi"><div class="label">máximo registado</div>
          <div class="value small">${eur(d.maximo)}</div></div>
        ${last.preco_ref ? `<div class="kpi"><div class="label">PVPR</div>
          <div class="value small" style="color:var(--ok)">${eur(last.preco_ref)}
          <span style="font-size:12px">−${desconto}%</span></div></div>` : ''}
      </div>

      ${pts.some(p => p.preco_ref != null) ? `<div class="legend">
        <span><i></i>preço pago</span>
        <span><i class="ctx"></i>PVPR — só nos dias em promoção</span></div>` : ''}

      <div class="chart-wrap" id="wrap">${chart(pts)}<div class="tip" id="tip"></div></div>

      ${pts.length < 2 ? `<div class="note">
        O histórico começa aqui. O continente.pt não publica preços passados — o
        único valor anterior que dá é o PVPR dos produtos em promoção. A partir
        de um segundo registo o gráfico ganha linha.</div>` : ''}

      <details><summary>Ver os números em tabela</summary>
        <table><thead><tr><th>dia</th><th>preço</th><th>PVPR</th><th>por unidade</th></tr></thead>
        <tbody>${pts.slice().reverse().map(p => `<tr>
          <td>${p.dia}</td><td>${eur(p.preco)}</td>
          <td>${eur(p.preco_ref)}</td><td>${esc(p.preco_unidade || '—')}</td>
        </tr>`).join('')}</tbody></table>
      </details>
    </figure>`;

  if (pts.length) wireChart(pts);
}

/* ---- o gráfico, em SVG ------------------------------------------------- */

const M = { t: 18, r: 58, b: 30, l: 46 };   // margem direita p/ o rótulo final
const H = 260;

function geom(pts) {
  const w = Math.max(420, Math.min(760, 90 + pts.length * 46));
  const iw = w - M.l - M.r, ih = H - M.t - M.b;
  const vals = pts.flatMap(p => [p.preco, p.preco_ref].filter(v => v != null));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= Math.max(0.1, lo * 0.06); hi += Math.max(0.1, hi * 0.06); }
  const pad = (hi - lo) * 0.15; lo -= pad; hi += pad;
  const x = i => M.l + (pts.length === 1 ? iw / 2 : (i / (pts.length - 1)) * iw);
  const y = v => M.t + ih - ((v - lo) / (hi - lo)) * ih;
  return { w, iw, ih, lo, hi, x, y };
}

function chart(pts) {
  if (!pts.length) return '';
  const g = geom(pts);
  const ticks = 4;
  const gridY = Array.from({ length: ticks + 1 }, (_, i) => g.lo + (i / ticks) * (g.hi - g.lo));

  /* Um traço por troço contínuo de dados. O PVPR só existe nos dias em que o
     produto esteve em promoção; uma única polyline saltaria por cima dos dias
     sem promoção e desenharia uma continuidade que não houve. */
  const segments = sel => {
    const out = []; let run = [];
    pts.forEach((p, i) => {
      if (p[sel] == null) { if (run.length) out.push(run); run = []; }
      else run.push(`${g.x(i)},${g.y(p[sel])}`);
    });
    if (run.length) out.push(run);
    return out;
  };
  const draw = (sel, cls) => segments(sel).map(seg => seg.length > 1
    ? `<polyline class="${cls}" points="${seg.join(' ')}"/>`
    : `<circle class="dot" cx="${seg[0].split(',')[0]}" cy="${seg[0].split(',')[1]}"
               r="3" style="fill:var(--context)"/>`).join('');

  const hasRef = pts.some(p => p.preco_ref != null);
  const last = pts[pts.length - 1];

  // Com um só registo, um ponto sozinho lê-se melhor do que uma linha de zero
  // comprimento; a partir de dois, a linha é a forma certa.
  const serie = pts.length > 1 ? draw('preco', 'serie') : '';
  const ctx = hasRef && pts.length > 1 ? draw('preco_ref', 'ctxline') : '';
  const refDot = hasRef && pts.length === 1
    ? `<line class="ctxline" x1="${M.l}" x2="${g.w - M.r}"
             y1="${g.y(last.preco_ref)}" y2="${g.y(last.preco_ref)}"/>
       <text class="axis" x="${g.w - M.r + 6}" y="${g.y(last.preco_ref) + 4}"
             style="fill:var(--context)">${eur(last.preco_ref)}</text>` : '';

  const dots = pts.map((p, i) =>
    `<circle class="dot" cx="${g.x(i)}" cy="${g.y(p.preco)}" r="${pts.length > 20 ? 3.5 : 5}"/>`
  ).join('');

  const labels = pts.map((p, i) => {
    const step = Math.ceil(pts.length / 7);
    return (i % step === 0 || i === pts.length - 1)
      ? `<text class="axis" x="${g.x(i)}" y="${H - 10}" text-anchor="middle">${dayLabel(p.dia)}</text>`
      : '';
  }).join('');

  return `<svg width="${g.w}" height="${H}" role="img"
       aria-label="Evolução do preço, ${pts.length} registos">
    <g class="grid">${gridY.map(v =>
      `<line x1="${M.l}" x2="${g.w - M.r}" y1="${g.y(v)}" y2="${g.y(v)}"/>`).join('')}</g>
    <g class="axis">${gridY.map(v =>
      `<text x="${M.l - 8}" y="${g.y(v) + 4}" text-anchor="end">${eur(v)}</text>`).join('')}</g>
    ${refDot}${ctx}${serie}${dots}
    <text class="endlabel" x="${g.x(pts.length - 1) + 10}"
          y="${g.y(last.preco) + 4}">${eur(last.preco)}</text>
    <g class="axis">${labels}</g>
    <line class="crosshair" id="cross" y1="${M.t}" y2="${H - M.b}" style="display:none"/>
    <rect id="hit" x="${M.l}" y="${M.t}" width="${g.iw}" height="${g.ih}" fill="transparent"/>
  </svg>`;
}

function wireChart(pts) {
  const svg = $('#wrap svg'), hit = $('#hit'), cross = $('#cross'), tip = $('#tip');
  if (!svg || !hit) return;
  const g = geom(pts);

  const move = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    let best = 0, bd = Infinity;
    pts.forEach((p, i) => { const d = Math.abs(g.x(i) - px); if (d < bd) { bd = d; best = i; } });
    const p = pts[best];
    cross.style.display = '';
    cross.setAttribute('x1', g.x(best)); cross.setAttribute('x2', g.x(best));
    tip.innerHTML = `${p.dia}<br><b>${eur(p.preco)}</b>${
      p.preco_ref ? `<br><span style="color:var(--context)">PVPR ${eur(p.preco_ref)}</span>` : ''}${
      p.preco_unidade ? `<br>${esc(p.preco_unidade)}` : ''}`;
    tip.classList.add('on');
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(g.x(best) + 12, g.w - tw - 4)) + 'px';
    tip.style.top = (g.y(p.preco) - 14) + 'px';
  };
  const leave = () => { cross.style.display = 'none'; tip.classList.remove('on'); };

  hit.addEventListener('mousemove', move);
  hit.addEventListener('mouseleave', leave);
  hit.addEventListener('touchmove', move, { passive: true });
  hit.addEventListener('touchend', leave);
}

/* ---- barra de topo ----------------------------------------------------- */

$('#filter').oninput = renderList;
$('#snap').onclick = async () => {
  const b = $('#snap'); b.disabled = true; b.textContent = 'a registar…';
  try {
    const r = await api('/prices/snapshot', { method: 'POST' });
    const extra = r.problems ? ` (${r.problems.length} avisos)` : '';
    $('main').insertAdjacentHTML('beforebegin',
      `<div class="msg" style="max-width:1180px;margin:14px auto 0">
        ${r.recorded} preços registados em ${r.day}${extra}.</div>`);
    setTimeout(() => document.querySelector('.msg')?.remove(), 6000);
    await loadList();
    if (CURRENT) select(CURRENT);
  } catch (e) { alert(e.message); }
  b.disabled = false; b.textContent = 'Registar preços de hoje';
};

loadList();
</script>
</body>
</html>
