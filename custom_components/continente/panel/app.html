<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cookidoo → Continente</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --ink: #16181c; --muted: #6b7280;
    --line: #e3e3df; --accent: #e30613; --ok: #0f7b3d; --ok-bg: #eaf6ee;
    --warn: #92400e; --warn-bg: #fdf3e3; --off: #9aa0a6;
    --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --card: #1f2124; --ink: #e9eaec; --muted: #9aa0a6;
      --line: #303236; --ok: #4ade80; --ok-bg: #14301f;
      --warn: #fbbf24; --warn-bg: #33280f; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    /* Dentro do painel do Home Assistant o iframe tem altura fixa; sem isto
       o fundo acabava onde o conteúdo acaba. */
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--card);
    border-bottom: 1px solid var(--line); padding: 14px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  .counts { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
  .counts b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; padding: 7px 13px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    font-weight: 600;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }
  .msg {
    padding: 12px 14px; border-radius: var(--radius); margin-bottom: 16px;
    border: 1px solid var(--line); background: var(--card); white-space: pre-wrap;
  }
  .msg.err { border-color: var(--accent); }
  .msg.ok { background: var(--ok-bg); border-color: var(--ok); }
  .group { margin: 22px 0 10px; font-size: 12px; letter-spacing: .07em;
           text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .item {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); margin-bottom: 8px; box-shadow: var(--shadow);
    overflow: hidden;
  }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.mapeado { background: var(--ok); }
  .dot.por_decidir { background: var(--warn); }
  .dot.ignorado { background: var(--off); }
  .name { font-weight: 550; }
  .amount { color: var(--muted); font-size: 13px; margin-left: 6px; }
  .target { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .target b { color: var(--ink); font-weight: 550; }
  .target.link { cursor: help; }
  .target.link:hover b { color: var(--accent); }
  .grow { flex: 1; min-width: 0; }
  .qty {
    width: 58px; font: inherit; padding: 5px 7px; text-align: center;
    border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: var(--ink);
  }
  .panel { border-top: 1px solid var(--line); padding: 12px 14px;
           background: var(--bg); }
  .cands { display: grid; gap: 7px; }
  .cand {
    display: flex; align-items: center; gap: 11px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    cursor: pointer; text-align: left; width: 100%;
  }
  .cand:hover { border-color: var(--accent); }
  .cand.on { border-color: var(--ok); }
  .cand img { width: 40px; height: 40px; object-fit: contain; flex: none;
              background: #fff; border-radius: 5px; }
  .cand .t { flex: 1; min-width: 0; }
  .cand .t small { color: var(--muted); }
  .cand-main { display: flex; align-items: center; gap: 11px; flex: 1;
               min-width: 0; border: none; background: none; padding: 0;
               text-align: left; color: inherit; cursor: pointer; }
  .cand-add { flex: none; width: 30px; height: 30px; padding: 0; font-size: 15px;
              border-radius: 7px; line-height: 1; }
  .cand.on .cand-add { color: var(--ok); border-color: var(--ok); }
  .hint-multi { margin-top: 8px; font-size: 12px; color: var(--ok); }
  .pick-basis { font-size: 11px; padding: 1px 7px; border-radius: 20px;
                background: var(--ok-bg); color: var(--ok); margin-left: 4px;
                cursor: help; }
  .price { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 20px;
         background: var(--ok-bg); color: var(--ok); white-space: nowrap; }
  .searchbar { display: flex; gap: 8px; margin-top: 10px; }
  .searchbar input {
    flex: 1; font: inherit; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  .muted { color: var(--muted); }
  .empty { text-align: center; padding: 50px 20px; color: var(--muted); }
  .spin { display: inline-block; width: 13px; height: 13px; flex: none;
          border: 2px solid var(--line); border-top-color: var(--accent);
          border-radius: 50%; animation: r .7s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }

  /* Pré-visualização do produto ao passar o rato. */
  #tip {
    position: fixed; z-index: 100; width: 270px; pointer-events: none;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: 0 8px 28px rgba(0,0,0,.22);
    padding: 12px; opacity: 0; transform: translateY(4px);
    transition: opacity .12s ease, transform .12s ease;
  }
  #tip.on { opacity: 1; transform: none; }
  #tip img {
    width: 100%; height: 175px; object-fit: contain; background: #fff;
    border-radius: 7px; margin-bottom: 9px;
  }
  #tip .tname { font-weight: 600; line-height: 1.35; }
  #tip .tbrand { color: var(--muted); font-size: 12px; margin-top: 1px; }
  #tip .tprice { font-size: 19px; font-weight: 650; margin: 7px 0 2px; }
  #tip dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px;
            margin: 9px 0 0; font-size: 12px; border-top: 1px solid var(--line);
            padding-top: 8px; }
  #tip dt { color: var(--muted); }
  #tip dd { margin: 0; text-align: right; }
  #tip .note {
    margin-top: 8px; padding: 6px 8px; border-radius: 6px; font-size: 12px;
    background: var(--warn-bg); color: var(--warn);
  }
  #tip .off { color: var(--accent); }
  .toggle { display: flex; align-items: center; gap: 6px; font-size: 13px;
            color: var(--muted); cursor: pointer; user-select: none; }
  .navlink { color: var(--muted); text-decoration: none; font-size: 14px; }
  .navlink:hover { color: var(--ink); }
  .item.owned .name { text-decoration: line-through; opacity: .65; }
  .badge-owned { font-size: 11px; padding: 2px 7px; border-radius: 20px;
                 background: var(--bg); color: var(--muted);
                 border: 1px solid var(--line); }
  .badge-src { font-size: 11px; padding: 2px 7px; border-radius: 20px;
               color: var(--muted); background: var(--bg); margin-left: 4px;
               max-width: 190px; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; display: inline-block; vertical-align: middle; }
  .badge-src.recipe { cursor: help; }

  /* --- separadores ------------------------------------------------- */
  .tabs { display: flex; gap: 2px; margin-left: 4px; }
  .tab {
    border: 0; background: none; color: var(--muted); font: inherit;
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
  }
  .tab:hover { color: var(--ink); background: var(--bg); }
  .tab[aria-selected="true"] {
    color: var(--ink); font-weight: 600; background: var(--bg);
    box-shadow: inset 0 -2px 0 var(--accent);
  }
  .only-lista, .only-precos { display: flex; align-items: center; gap: 16px; }
  /* `hidden` não vence um `display` explícito — é preciso dizê-lo. */
  .only-lista[hidden], .only-precos[hidden], [hidden] { display: none !important; }
  .pv-bar { display: flex; align-items: center; gap: 14px; padding: 16px 20px 0;
            max-width: 1180px; margin: 0 auto; }
  .pv-stats { color: var(--muted); font-size: 13px; flex: 1; }
  /* O layout de duas colunas vivia no <main> da página separada; agora é aqui. */
  .pv-grid {
    max-width: 1180px; margin: 0 auto; padding: 18px 20px;
    display: grid; grid-template-columns: 330px 1fr; gap: 18px;
    align-items: start;
  }
  @media (max-width: 880px) { .pv-grid { grid-template-columns: 1fr; } }
  /* o gráfico traz as suas próprias cores de série */
  :root { --series-1: #2a78d6; --context: #8b8f96; --grid: #e8e8e4;
          --surface-1: #ffffff; --up: #c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --series-1: #3987e5; --context: #7c8288; --grid: #2b2d31;
            --surface-1: #1f2124; --up: #fb923c; }
  }

:root {
    --bg: #f6f6f4; --card: #fff; --ink: #16181c; --muted: #6b7280;
    --line: #e3e3df; --accent: #e30613;
    --surface-1: #ffffff;          /* superfície do gráfico */
    --series-1: #2a78d6;           /* o preço — a série que importa */
    --context: #8b8f96;            /* o PVPR — contexto, de-emphasis */
    --grid: #e8e8e4;
    --ok: #0f7b3d; --ok-bg: #eaf6ee; --up: #c2410c;
    --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,.07);
  }
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --card: #1f2124; --ink: #e9eaec; --muted: #9aa0a6;
      --line: #303236; --surface-1: #1f2124; --series-1: #3987e5;
      --context: #7c8288; --grid: #2b2d31;
      --ok: #4ade80; --ok-bg: #14301f; --up: #fb923c; --shadow: none;
    }
  }
:root[data-theme="dark"] {
    --bg: #17181a; --card: #1f2124; --ink: #e9eaec; --muted: #9aa0a6;
    --line: #303236; --surface-1: #1f2124; --series-1: #3987e5;
    --context: #7c8288; --grid: #2b2d31;
    --ok: #4ade80; --ok-bg: #14301f; --up: #fb923c; --shadow: none;
  }
@media (max-width: 880px) { main { grid-template-columns: 1fr; } }

  
  
  
  #view-precos * { box-sizing: border-box; }
  #view-precos { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #view-precos header { position: sticky; top: 0; z-index: 10; background: var(--card);
           border-bottom: 1px solid var(--line); padding: 14px 20px;
           display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  #view-precos h1 { font-size: 17px; margin: 0; font-weight: 650; }
  #view-precos h1 span { color: var(--accent); }
  #view-precos a.nav { color: var(--muted); text-decoration: none; font-size: 14px; }
  #view-precos a.nav:hover { color: var(--ink); }
  #view-precos .spacer { flex: 1; }
  #view-precos button { font: inherit; cursor: pointer; border-radius: 8px; padding: 7px 13px;
           border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  #view-precos button:hover:not(:disabled) { border-color: var(--muted); }
  #view-precos button:disabled { opacity: .5; cursor: default; }
  #view-precos button.primary { background: var(--accent); border-color: var(--accent);
                   color: #fff; font-weight: 600; }
  #view-precos main { max-width: 1180px; margin: 0 auto; padding: 20px;
         display: grid; grid-template-columns: 330px 1fr; gap: 18px; align-items: start; }
  
  #view-precos .card { background: var(--card); border: 1px solid var(--line);
          border-radius: var(--radius); box-shadow: var(--shadow); }
  #view-precos .side { padding: 12px; max-height: 78vh; overflow: auto; }
  #view-precos .side input { width: 100%; font: inherit; padding: 8px 10px; margin-bottom: 10px;
                border: 1px solid var(--line); border-radius: 8px;
                background: var(--bg); color: var(--ink); }
  #view-precos .prod { display: flex; align-items: center; gap: 10px; padding: 9px 10px;
          border-radius: 8px; cursor: pointer; width: 100%; text-align: left;
          border: 1px solid transparent; background: none; color: var(--ink); }
  #view-precos .prod:hover { background: var(--bg); }
  #view-precos .prod[aria-current="true"] { border-color: var(--series-1); background: var(--bg); }
  #view-precos .prod .n { flex: 1; min-width: 0; font-size: 14px; }
  #view-precos .prod .n small { color: var(--muted); display: block; }
  #view-precos .pill { font-size: 11px; padding: 2px 7px; border-radius: 20px; white-space: nowrap;
          background: var(--ok-bg); color: var(--ok); }
  #view-precos .pill.up { background: transparent; color: var(--up); border: 1px solid var(--up); }
  #view-precos .pill.flat { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  #view-precos .detail { padding: 18px 20px 20px; }
  #view-precos .figure-title { font-size: 16px; font-weight: 650; margin: 0; }
  #view-precos .figure-sub { color: var(--muted); font-size: 13px; margin: 2px 0 16px; }
  #view-precos .kpis { display: flex; gap: 26px; flex-wrap: wrap; margin-bottom: 6px; }
  #view-precos .kpi .label { font-size: 12px; color: var(--muted); }
  #view-precos .kpi .value { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums;
                line-height: 1.2; }
  #view-precos .kpi .value.small { font-size: 17px; font-weight: 600; }
  #view-precos .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted);
            margin: 14px 0 2px; }
  #view-precos .legend i { display: inline-block; width: 16px; height: 0; vertical-align: middle;
              margin-right: 6px; border-top: 2px solid var(--series-1); }
  #view-precos .legend i.ctx { border-top: 2px dashed var(--context); }
  #view-precos figure { margin: 0; }
  #view-precos .chart-wrap { position: relative; overflow-x: auto; overflow-y: hidden; }
  #view-precos svg { display: block; touch-action: none; }
  #view-precos .grid line { stroke: var(--grid); stroke-width: 1; }
  #view-precos .axis text { fill: var(--muted); font-size: 11px; }
  #view-precos .serie { fill: none; stroke: var(--series-1); stroke-width: 2;
           stroke-linejoin: round; stroke-linecap: round; }
  #view-precos .ctxline { fill: none; stroke: var(--context); stroke-width: 2;
             stroke-dasharray: 5 4; }
  #view-precos .dot { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
  #view-precos .crosshair { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  #view-precos .endlabel { fill: var(--ink); font-size: 12px; font-weight: 600; }
  #view-precos .tip { position: absolute; left: 0; top: 0; pointer-events: none; background: var(--card);
         border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
         font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.18);
         opacity: 0; transition: opacity .1s; white-space: nowrap; }
  #view-precos .tip.on { opacity: 1; }
  #view-precos .tip b { font-size: 14px; }
  #view-precos .note { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
          padding: 10px 12px; font-size: 13px; color: var(--muted); margin-top: 16px; }
  #view-precos table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 10px; }
  #view-precos th, #view-precos td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  #view-precos th:first-child, #view-precos td:first-child { text-align: left; }
  #view-precos th { color: var(--muted); font-weight: 550; }
  #view-precos details { margin-top: 14px; }
  #view-precos summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  #view-precos .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  #view-precos .msg { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
         background: var(--card); margin-bottom: 14px; font-size: 14px; }

</style>
</head>
<body>
<header>
  <h1>Cookidoo <span>→</span> Continente</h1>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-lista" role="tab" aria-selected="true">Lista</button>
    <button class="tab" id="tab-precos" role="tab" aria-selected="false">Preços</button>
  </div>
  <div class="counts only-lista" id="counts"></div>
  <div class="spacer"></div>
  <div class="only-lista">
  <label class="toggle" title="Esconde os que estão em &quot;Itens que tem&quot; no Cookidoo. Os que já mapeaste ficam sempre à vista.">
    <input type="checkbox" id="hideOwned" checked> esconder os itens que tens</label>
  <label class="toggle" title="Ao enviar, passa para &quot;Itens que tem&quot; no Cookidoo os que entraram mesmo no carrinho.">
    <input type="checkbox" id="markDone" checked> marcar como tens, ao enviar</label>
  <button id="reload" title="Vai buscar a lista ao Cookidoo outra vez">Recarregar</button>
  <button id="send" class="primary">Enviar para o carrinho</button>
  </div>
</header>

<main>
<section id="view-lista">
  <div id="msg"></div>
  <div id="list"><div class="empty"><span class="spin"></span> A ler a lista…</div></div>
</section>
</main>

<section id="view-precos" hidden>
  <div class="pv-bar"><span id="pv-stats" class="pv-stats"></span><button id="pv-snap" class="primary">Registar preços de hoje</button></div>
  <div class="pv-grid">
  <aside class="card side">
    <input id="pv-filter" placeholder="filtrar produtos…" autocomplete="off">
    <div id="pv-list"><div class="empty">a carregar…</div></div>
  </aside>

  <section class="card detail" id="pv-detail">
    <div class="empty">Escolhe um produto à esquerda.</div>
  </section>
</div>
</section>


<div id="tip"></div>

<script>
const API = '/api/continente';   // as rotas da integração
const $ = s => document.querySelector(s);
// O controller, não /checkout/carrinho/: só ele prepara o estado antes de lá
// chegar — o link direto devolve a homepage.
const CART_URL = 'https://www.continente.pt/on/demandware.store/Sites-continente-Site/default/Cart-Show';
let ITEMS = [];            // a lista, mantida em memória
let CANDS = {};            // termo -> hipóteses
let PENDING = new Set();   // termos cujas hipóteses estão a ser procuradas
let OPEN = null;

const api = async (path, opts = {}) => {
  const r = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' }, ...opts
  });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `${r.status} ${r.statusText}`);
  return body;
};

const say = (t, kind = '') => {
  $('#msg').innerHTML = t ? `<div class="msg ${kind}">${t}</div>` : '';
};
const money = v => v == null ? '' : v.toFixed(2).replace('.', ',') + '€';
const esc = s => (s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* Os nomes repetem-se na lista — há quatro "cebola", vindas de receitas
   diferentes e uma escrita por ti. Cada linha identifica-se pelo `id` do item;
   o mapeamento é que é por nome, e vale para todas as linhas com esse nome. */
const byId = id => ITEMS.find(i => i.id === id);
const norm = s => (s || '').trim().toLowerCase().normalize('NFKD')
  .replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9\s]/g, ' ')
  .replace(/\s+/g, ' ').trim();

/* Um item pronto e marcado no Cookidoo continua à vista, mas não se compra. */
const willBuy = it => it.status === 'mapeado' && !it.owned;
/* O filtro nunca esconde o que já mapeaste. */
const visible = it => !($('#hideOwned').checked && it.owned && it.status !== 'mapeado');

async function load(refresh = false) {
  say('');
  $('#list').innerHTML = `<div class="empty"><span class="spin"></span> ${
    refresh ? 'A ler a lista do Cookidoo…' : 'A carregar…'}</div>`;
  try {
    const data = await api('/sync/list' + (refresh ? '?refresh=true' : ''));
    ITEMS = data.items;
    render();
    prefetch();
  } catch (e) {
    $('#list').innerHTML = '';
    say(`Não consegui ler a lista: ${esc(e.message)}`, 'err');
  }
}

/* Hipóteses para os itens que interessam decidir. Cada uma é uma pesquisa no
   Continente, por isso só se adiantam os que estão à vista e por decidir. */
async function prefetch() {
  // Nomes distintos: quatro linhas de "cebola" são uma só pesquisa.
  const todo = [...new Set(ITEMS
    .filter(it => it.status === 'por_decidir' && visible(it) && !CANDS[it.name])
    .map(it => it.name))].slice(0, 25);
  if (!todo.length) return;

  todo.forEach(t => PENDING.add(t));
  paintPending();
  try {
    Object.assign(CANDS, await api('/sync/candidates', {
      method: 'POST', body: JSON.stringify({ terms: todo })
    }));
  } catch (e) {
    todo.forEach(t => { if (!CANDS[t]) CANDS[t] = null; });  // null = falhou
  }
  todo.forEach(t => PENDING.delete(t));
  paintPending();
  const open = OPEN && byId(OPEN);
  if (open && todo.includes(open.name)) renderPanel(OPEN);
}

/* Atualiza só as linhas de estado das hipóteses, sem redesenhar a lista. */
function paintPending() {
  document.querySelectorAll('[data-hint]').forEach(el => {
    el.innerHTML = hintHtml(el.dataset.hint);
  });
}

function hintHtml(term) {
  if (PENDING.has(term)) return '<span class="spin"></span>';
  const c = CANDS[term];
  if (c === undefined) return '<span class="muted">carrega em Escolher</span>';
  if (c === null) return '<span class="muted">a pesquisa falhou</span>';
  return c.length
    ? `<span class="muted">${c.length} hipóteses</span>`
    : '<span class="muted">sem resultados</span>';
}

function render() {
  const shown = ITEMS.filter(visible);
  const ready = shown.filter(willBuy).length;
  const undecided = shown.filter(i => i.status === 'por_decidir').length;
  const owned = ITEMS.filter(i => i.owned).length;

  $('#counts').innerHTML = `
    <span><b>${ready}</b> a comprar</span>
    <span><b>${undecided}</b> por decidir</span>
    <span><b>${owned}</b> já tens</span>`;
  $('#send').disabled = !ready;
  $('#send').textContent = `Enviar ${ready} para o carrinho`;

  if (!shown.length) {
    $('#list').innerHTML = `<div class="empty">${ITEMS.length
      ? 'Já tens tudo o que resta.'
      : 'A lista do Cookidoo está vazia.'}</div>`;
    return;
  }

  /* Um item pronto mas já marcado no Cookidoo não vai para o carrinho — pô-lo
     ao lado dos que vão só faz parecer que se compram oito quando são três. */
  const bucket = it =>
    it.status === 'por_decidir' ? (it.owned ? 'decidir_marcado' : 'decidir')
    : it.status === 'mapeado' ? (it.owned ? 'pronto_marcado' : 'pronto')
    : 'ignorado';

  const GROUPS = [
    ['decidir', 'Por decidir'],
    ['pronto', `Vão para o carrinho — ${ready}`],
    ['decidir_marcado', 'Por decidir · já os tens'],
    ['pronto_marcado', 'Prontos · já os tens, não vão'],
    ['ignorado', 'Ignorados'],
  ];

  let html = '';
  for (const [key, title] of GROUPS) {
    const rows = shown.filter(it => bucket(it) === key);
    if (!rows.length) continue;
    html += `<div class="group">${title}</div>` + rows.map(itemHtml).join('');
  }
  $('#list').innerHTML = html;
  wire();
}

function itemHtml(it) {
  const m = it.mapped;
  let target;
  if (it.status === 'mapeado') {
    const nope = it.owned ? ' <span class="muted">· não vai (já tens)</span>' : '';
    const n = (it.options || []).length;
    const alt = n > 1
      ? ` <span class="pick-basis" title="Escolhido entre ${n} produtos aceites para este item.">${
          esc(it.basis || `mais barato de ${n}`)}</span>` : '';
    target = `<div class="target link" data-peek="${esc(it.id)}">→ <b>${
      esc(m.nome_continente || m.pid)}</b> <span class="muted">· ${esc(m.pid)}</span>${alt}${nope}</div>`;
  } else if (it.status === 'ignorado') {
    target = '<div class="target muted">não vai para o carrinho</div>';
  } else {
    target = `<div class="target" data-hint="${esc(it.name)}">${hintHtml(it.name)}</div>`;
  }

  const qty = it.status === 'mapeado'
    ? `<input class="qty" type="number" min="0" step="0.1" value="${m.quantidade ?? 1}"
              data-qty="${esc(it.id)}" title="quantidade a comprar">` : '';

  const actions = it.status === 'por_decidir'
    ? `<button data-open="${esc(it.id)}">Escolher</button>
       <button data-ignore="${esc(it.id)}" title="nunca comprar isto">Ignorar</button>`
    : `<button data-open="${esc(it.id)}">Trocar</button>
       <button data-forget="${esc(it.id)}" title="esquecer a decisão">✕</button>`;

  return `<div class="item ${it.owned ? 'owned' : ''}" data-item="${esc(it.id)}">
    <div class="row">
      <span class="dot ${it.status}"></span>
      <div class="grow">
        <span class="name">${esc(it.name)}</span>
        <span class="amount">${esc(it.amount)}</span>
        ${originBadge(it)}${ownedBadge(it)}
        ${target}
      </div>
      ${qty}${actions}
    </div>
  </div>`;
}

/* Uma linha pode juntar várias entradas do Cookidoo com o mesmo nome — três
   receitas a pedir cebola, ou um artigo que escreveste duas vezes. */

function originBadge(it) {
  const s = it.sources || {};
  const recipes = it.recipes || [];
  const parts = [];
  if (s.receita) {
    parts.push(recipes.length === 1 ? recipes[0]
      : `${recipes.length || s.receita} receitas`);
  }
  if (s.extra) parts.push('teu');
  if (!parts.length) return '';
  return `<span class="badge-src${s.receita ? ' recipe' : ''}"
    title="${esc(recipes.length ? recipes.join(', ') : 'escrito por ti')}"
    >${esc(parts.join(' · '))}</span>`;
}

function ownedBadge(it) {
  // Só quando está mesmo tratado. Quantas entradas repetidas o Cookidoo tem
  // por trás é problema nosso, não informação para quem faz as compras: um
  // item que ainda falta comprar aparece na lista, e isso basta.
  return it.owned ? '<span class="badge-owned">já tens</span>' : '';
}

function wire() {
  document.querySelectorAll('[data-open]').forEach(b =>
    b.onclick = () => toggle(b.dataset.open));
  document.querySelectorAll('[data-ignore]').forEach(b =>
    b.onclick = () => ignore(byId(b.dataset.ignore).name));
  document.querySelectorAll('[data-forget]').forEach(b =>
    b.onclick = () => forget(byId(b.dataset.forget).name));
  document.querySelectorAll('[data-qty]').forEach(inp =>
    inp.onchange = () => setQty(byId(inp.dataset.qty).name, parseFloat(inp.value) || 1));
  // Pré-visualização também no produto já escolhido.
  document.querySelectorAll('[data-peek]').forEach(el => {
    const it = byId(el.dataset.peek);
    if (!it || !it.mapped) return;
    const c = { pid: it.mapped.pid, name: it.mapped.nome_continente || it.mapped.pid };
    el.onmouseenter = () => armTip(el, c);
    el.onmouseleave = hideTip;
  });
}

/* ---- decisões: mudam o estado em memória, sem reler o Cookidoo ---------- */

async function ignore(term) {
  try {
    const row = await api('/sync/ignore', {
      method: 'POST', body: JSON.stringify({ term })
    });
    patch(term, { status: 'ignorado', mapped: row });
  } catch (e) { say(esc(e.message), 'err'); }
}

async function forget(term) {
  try {
    await api('/sync/map?term=' + encodeURIComponent(term), { method: 'DELETE' });
    patch(term, { status: 'por_decidir', mapped: null });
    if (!CANDS[term]) prefetch();
  } catch (e) { say(esc(e.message), 'err'); }
}

async function pick(term, choice) {
  try {
    const row = await api('/sync/map', {
      method: 'POST',
      body: JSON.stringify({ term, pid: choice.pid, name: choice.name, quantity: 1 })
    });
    OPEN = null;
    patch(term, { status: 'mapeado', mapped: row });
  } catch (e) { say(esc(e.message), 'err'); }
}

/* Vários produtos aceites para o mesmo item: compra-se o mais barato. */

async function addOption(id, choice) {
  const it = byId(id);
  try {
    await api('/sync/map', { method: 'POST', body: JSON.stringify({
      term: it.name, pid: choice.pid, name: choice.name,
      quantity: (it.mapped && it.mapped.quantidade) || 1, replace: false })});
    await refreshChoice(it.name);
    renderPanel(id);
  } catch (e) { say(esc(e.message), 'err'); }
}

async function dropOption(id, pid) {
  const it = byId(id);
  try {
    await api(`/sync/map/option?term=${encodeURIComponent(it.name)}&pid=${
      encodeURIComponent(pid)}`, { method: 'DELETE' });
    await refreshChoice(it.name);
    renderPanel(id);
  } catch (e) { say(esc(e.message), 'err'); }
}

/* Qual dos aceites ganha hoje é decidido no servidor, que sabe os preços. */
async function refreshChoice(term) {
  const key = norm(term);
  try {
    const r = await api('/sync/best?term=' + encodeURIComponent(term));
    const opts = await api('/sync/list');   // vem de cache, é instantâneo
    const fresh = opts.items.find(i => norm(i.name) === key);
    ITEMS.filter(i => norm(i.name) === key).forEach(i => Object.assign(i, {
      status: fresh ? fresh.status : (r.chosen ? 'mapeado' : 'por_decidir'),
      mapped: r.chosen || (fresh && fresh.mapped) || null,
      options: fresh ? fresh.options : [],
      basis: r.basis || null,
    }));
  } catch (e) { /* o render seguinte mostra o que houver */ }
  render();
}

async function setQty(term, quantity) {
  // A quantidade é do item, não do produto: vale para todos os aceites.
  try {
    const r = await api(`/sync/quantity?term=${encodeURIComponent(term)}&quantity=${quantity}`,
      { method: 'PATCH' });
    const key = norm(term);
    ITEMS.filter(i => norm(i.name) === key).forEach(i => {
      i.options = r.options;
      if (i.mapped) i.mapped = { ...i.mapped, quantidade: quantity };
    });
    say(`Quantidade de <b>${esc(term)}</b> guardada: ${quantity}.`, 'ok');
  } catch (e) { say(esc(e.message), 'err'); }
}

function patch(term, changes) {
  // O mapeamento é guardado por nome, por isso decidir uma "cebola" decide
  // todas — as três das receitas e a que escreveste. Atualizar só a linha
  // clicada deixava as outras num estado que já não é verdade.
  const key = norm(term);
  ITEMS.filter(i => norm(i.name) === key).forEach(i => Object.assign(i, changes));
  hideTip();
  render();
}

/* ---- hipóteses --------------------------------------------------------- */

async function toggle(id) {
  const it = byId(id);
  if (!it) return;
  const term = it.name;
  const card = document.querySelector(`[data-item="${CSS.escape(id)}"]`);
  const open = card.querySelector('.panel');
  document.querySelectorAll('.panel').forEach(p => p.remove());
  if (open) { OPEN = null; return; }
  OPEN = id;
  card.insertAdjacentHTML('beforeend',
    '<div class="panel"><span class="spin"></span> a procurar…</div>');
  if (!CANDS[term]) {
    PENDING.add(term); paintPending();
    try {
      Object.assign(CANDS, await api('/sync/candidates', {
        method: 'POST', body: JSON.stringify({ terms: [term] })
      }));
    } catch (e) { CANDS[term] = null; }
    PENDING.delete(term); paintPending();
  }
  if (OPEN === id) renderPanel(id);
}

function renderPanel(id) {
  const it = byId(id);
  if (!it) return;
  const term = it.name;
  const card = document.querySelector(`[data-item="${CSS.escape(id)}"]`);
  const panel = card && card.querySelector('.panel');
  if (!panel) return;
  ensureDetails(it.options || [], CANDS[term] || [], id);
  panel.innerHTML = candsHtml(CANDS[term] || [], it.options || []) + searchHtml();
  panel.querySelectorAll('[data-pick]').forEach(b =>
    b.onclick = () => { hideTip(); pick(term, JSON.parse(b.dataset.pick)); });
  panel.querySelectorAll('[data-add]').forEach(b =>
    b.onclick = () => { hideTip(); addOption(id, JSON.parse(b.dataset.add)); });
  panel.querySelectorAll('[data-drop]').forEach(b =>
    b.onclick = () => { hideTip(); dropOption(id, JSON.parse(b.dataset.drop).pid); });
  wireTips(panel);

  const input = panel.querySelector('input');
  const go = async () => {
    if (!input.value.trim()) return;
    panel.querySelector('.cands').innerHTML = '<span class="spin"></span>';
    try {
      const r = await api('/sync/search?q=' + encodeURIComponent(input.value));
      CANDS[term] = r.results;
    } catch (e) { CANDS[term] = null; }
    renderPanel(id);
  };
  panel.querySelector('[data-go]').onclick = go;
  input.onkeydown = e => { if (e.key === 'Enter') go(); };
}

function candsHtml(list, accepted = []) {
  const has = pid => accepted.some(o => o.pid === pid);
  const rows = list.map(c => `
    <div class="cand ${has(c.pid) ? 'on' : ''}">
      <button class="cand-main" data-pick='${esc(JSON.stringify({ pid: c.pid, name: c.name }))}'
              data-full='${esc(JSON.stringify(c))}' title="usar só este">
        ${c.image ? `<img src="${esc(c.image)}" alt="" loading="lazy">` : '<img alt="">'}
        <span class="t">${esc(c.name)}<br><small>${esc(c.pid)}${
          c.category ? ' · ' + esc(c.category) : ''}</small></span>
        ${c.origin === 'já compras' ? '<span class="tag">já compras</span>' : ''}
        <span class="price">${money(c.price)}</span>
      </button>
      <button class="cand-add" data-${has(c.pid) ? 'drop' : 'add'}='${
        esc(JSON.stringify({ pid: c.pid, name: c.name }))}'
        title="${has(c.pid) ? 'tirar dos aceites' : 'aceitar também — compra-se o mais barato'}"
      >${has(c.pid) ? '✓' : '+'}</button>
    </div>`).join('');

  /* Aceites que não vêm nas hipóteses de hoje — a pesquisa muda de dia para
     dia, e o produto escolhido pode não estar entre os primeiros. Mostram-se
     como os outros, com a foto e o preço que o produto tem agora. */
  const extra = accepted.filter(o => !list.some(c => c.pid === o.pid)).map(o => {
    const d = DETAILS[o.pid] || null;
    const c = {
      pid: o.pid,
      name: (d && d.name) || o.nome_continente || o.pid,
      price: d && d.price,
      image: d && d.image,
      brand: d && d.brand,
    };
    return `
    <div class="cand on">
      <button class="cand-main" data-pick='${esc(JSON.stringify({ pid: c.pid, name: c.name }))}'
              data-full='${esc(JSON.stringify(c))}' title="usar só este">
        ${c.image ? `<img src="${esc(c.image)}" alt="" loading="lazy">` : '<img alt="">'}
        <span class="t">${esc(c.name)}<br><small>${esc(c.pid)}${
          d ? '' : ' · a carregar…'}</small></span>
        <span class="price">${money(c.price)}</span>
      </button>
      <button class="cand-add" data-drop='${esc(JSON.stringify({ pid: c.pid, name: c.name }))}'
              title="tirar dos aceites">✓</button>
    </div>`;
  }).join('');

  if (!list.length && !extra)
    return '<div class="cands"><span class="muted">Nada encontrado. Procura por outro termo:</span></div>';
  return `<div class="cands">${rows}${extra}</div>${
    accepted.length > 1
      ? `<div class="hint-multi">${accepted.length} produtos aceites — compra-se o mais barato à unidade de medida.</div>`
      : ''}`;
}

const searchHtml = () => `<div class="searchbar">
    <input placeholder="procurar outro produto no Continente…">
    <button data-go>Procurar</button>
  </div>`;

/* ---- pré-visualização -------------------------------------------------- */

const DETAILS = {};   // pid -> detalhe, ou null quando não deu
let tipTimer = null, tipPid = null;

/* Vai buscar o detalhe dos produtos aceites que a pesquisa de hoje não trouxe,
   para aparecerem com foto e preço como os outros. Redesenha quando chegam. */
async function ensureDetails(options, list, panelId) {
  const missing = options
    .map(o => o.pid)
    .filter(pid => pid !== '-' && DETAILS[pid] === undefined
                   && !list.some(c => c.pid === pid));
  if (!missing.length) return;

  missing.forEach(pid => { DETAILS[pid] = null; });   // não pedir duas vezes
  await Promise.all(missing.map(async pid => {
    try {
      const p = await api('/product/' + encodeURIComponent(pid));
      DETAILS[pid] = {
        name: p.name, brand: p.brand, price: p.price,
        price_per_unit: p.price_per_unit, min_quantity: p.min_quantity,
        step_quantity: p.step_quantity, primary_unit: p.primary_unit,
        out_of_stock: p.out_of_stock,
        image: Array.isArray(p.image) ? p.image[0] : p.image,
      };
    } catch (e) { DETAILS[pid] = null; }
  }));
  if (OPEN === panelId) renderPanel(panelId);
}
const big = u => u ? u.replace(/sw=\d+&sh=\d+/, 'sw=400&sh=400') : '';

function tipHtml(c, d, loading) {
  const rows = [['id', c.pid]];
  if (d) {
    if (d.price_per_unit) rows.push(['preço', d.price_per_unit]);
    if (d.min_quantity > 1 || d.step_quantity > 1)
      rows.push(['vende-se em', `${d.min_quantity}${d.primary_unit ? ' ' + d.primary_unit : ''}`]);
    else if (d.primary_unit) rows.push(['unidade', d.primary_unit]);
  }
  const warn = d && (d.min_quantity > 1 || d.step_quantity > 1)
    ? `<div class="note">Mínimo ${d.min_quantity}${d.primary_unit ? ' ' + d.primary_unit : ''}${
        d.step_quantity > 1 ? `, de ${d.step_quantity} em ${d.step_quantity}` : ''}.</div>` : '';
  const stock = d && d.out_of_stock ? '<div class="note off">Sem stock.</div>' : '';
  const price = d && d.price != null ? d.price : c.price;
  const img = c.image ? big(c.image) : (d && d.image);

  return `
    ${img ? `<img src="${esc(img)}" alt="" onerror="this.remove()">` : ''}
    <div class="tname">${esc((d && d.name) || c.name)}</div>
    ${(d && d.brand) || c.brand ? `<div class="tbrand">${esc((d && d.brand) || c.brand)}</div>` : ''}
    <div class="tprice">${money(price)}</div>
    ${c.category ? `<div class="tbrand">${esc(c.category)}</div>` : ''}
    <dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(String(v))}</dd>`).join('')}
      ${loading ? '<dt>detalhe</dt><dd><span class="spin"></span></dd>' : ''}
      ${d === null && !loading ? '<dt>detalhe</dt><dd class="muted">indisponível</dd>' : ''}
    </dl>${warn}${stock}`;
}

function placeTip(el) {
  const tip = $('#tip'), r = el.getBoundingClientRect(), w = 270, gap = 12;
  let left = r.right + gap;
  if (left + w > innerWidth - 8) left = r.left - w - gap;
  tip.style.left = Math.max(8, left) + 'px';
  const h = tip.offsetHeight || 340;
  tip.style.top = Math.max(8, Math.min(r.top, innerHeight - h - 8)) + 'px';
}

function armTip(el, c) {
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => showTip(el, c), 220);
}

async function showTip(el, c) {
  tipPid = c.pid;
  const tip = $('#tip');
  const known = DETAILS[c.pid];
  tip.innerHTML = tipHtml(c, known ?? null, known === undefined);
  tip.classList.add('on');
  placeTip(el);
  if (known !== undefined) return;

  let d = null;
  try {
    const p = await api('/product/' + encodeURIComponent(c.pid));
    d = { name: p.name, brand: p.brand, price: p.price,
          price_per_unit: p.price_per_unit, min_quantity: p.min_quantity,
          step_quantity: p.step_quantity, primary_unit: p.primary_unit,
          out_of_stock: p.out_of_stock,
          image: Array.isArray(p.image) ? p.image[0] : p.image };
  } catch (e) { d = null; }
  DETAILS[c.pid] = d;               // null fica registado: não repete o pedido
  if (tipPid === c.pid && tip.classList.contains('on')) {
    tip.innerHTML = tipHtml(c, d, false);
    placeTip(el);
  }
}

function hideTip() {
  clearTimeout(tipTimer); tipPid = null;
  $('#tip').classList.remove('on');
}

function wireTips(panel) {
  panel.querySelectorAll('[data-pick]').forEach(btn => {
    const c = JSON.parse(btn.dataset.full);
    btn.onmouseenter = () => armTip(btn, c);
    btn.onmouseleave = hideTip;
  });
}

/* ---- barra de topo ----------------------------------------------------- */

$('#reload').onclick = () => load(true);
$('#hideOwned').onchange = () => { render(); prefetch(); };
addEventListener('scroll', hideTip, { passive: true });

$('#send').onclick = async () => {
  const going = ITEMS.filter(visible).filter(willBuy).length;
  $('#send').disabled = true;
  say(`<span class="spin"></span> a enviar ${going} para o carrinho…`);
  try {
    const r = await api('/sync/send', {
      method: 'POST', body: JSON.stringify({
        include_owned: false, mark_done: $('#markDone').checked })
    });
    // Sem o item da lista e o nome do produto, um "7721353 — esgotado" não
    // diz nada a ninguém.
    const lines = r.results.map(x => {
      const de = esc((x.terms || []).join(', '));
      const produto = esc(x.produto || (x.line && x.line.name) || x.pid);
      if (x.ok) {
        const qtd = x.line ? `${x.line.quantity} ${x.line.unit || ''}`.trim() : '';
        const nota = x.fallback
          ? `\n     ↳ ${esc(x.fallback)}; usou-se esta alternativa` : '';
        return `✅ ${de} → ${produto}${qtd ? ' — ' + qtd : ''}${nota}`;
      }
      const outras = (x.tambem_falharam || [])
        .map(t => `\n     ↳ ${esc(t.produto)} também não: ${esc(t.reason || '')}`)
        .join('');
      return `❌ ${de} → ${produto} — ${esc(x.reason || 'não entrou')}${outras}`;
    }).join('\n');
    // Sem sessão iniciada o site aceita tudo — mas num carrinho de convidado,
    // que nunca aparece na conta. Melhor dizê-lo do que deixar acreditar.
    const anon = r.cart.authenticated === false
      ? '\n\n⚠ A sessão não está autenticada: isto foi para um carrinho de convidado, não para a tua conta.'
      : '';
    const marked = r.marked
      ? `\n${r.marked} ${r.marked === 1 ? 'item passou' : 'itens passaram'} a "Itens que tem" no Cookidoo.` : '';
    say(`<b>${r.added} no carrinho</b>, ${r.failed} falharam. Total: <b>${
      esc(r.cart.grand_total)}</b>${anon}${marked}\n\n${lines}\n\n<a href="${CART_URL}"
      target="_blank" rel="noopener">Abrir o carrinho no continente.pt →</a>`,
      r.failed || anon ? '' : 'ok');
    if (r.marked) await load();   // o Cookidoo mudou; reler a lista
  } catch (e) { say(esc(e.message), 'err'); }
  render();
};

let PV_PRODUCTS = [], PV_CURRENT = null;

const pvEur = v => v == null ? '—' : v.toFixed(2).replace('.', ',') + '€';
const pvDay = d => d.slice(8, 10) + '/' + d.slice(5, 7);

async function pvLoad() {
  try {
    const r = await api('/prices/tracked');
    PV_PRODUCTS = r.products;
    const s = r.stats;
    $('#pv-stats').textContent = s.produtos
      ? `${s.produtos} produtos · ${s.dias} ${s.dias === 1 ? 'dia' : 'dias'} desde ${s.desde}`
      : 'sem registos';
    pvRenderList();
    if (PV_PRODUCTS.length && !PV_CURRENT) pvSelect(PV_PRODUCTS[0].pid);
  } catch (e) {
    $('#pv-list').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function pvRenderList() {
  const q = $('#pv-filter').value.trim().toLowerCase();
  const rows = PV_PRODUCTS.filter(p => !q || (p.nome || '').toLowerCase().includes(q));
  if (!rows.length) {
    $('#pv-list').innerHTML = `<div class="empty">${PV_PRODUCTS.length
      ? 'Nada corresponde.' : 'Ainda não há registos. Carrega em “Registar preços de hoje”.'}</div>`;
    return;
  }
  $('#pv-list').innerHTML = rows.map(p => {
    const v = p.variacao;
    const cls = v == null || v === 0 ? 'flat' : v < 0 ? '' : 'up';
    const txt = v == null || v === 0 ? '—' : (v > 0 ? '+' : '') + v + '%';
    const promo = p.preco_ref ? ` · PVPR ${pvEur(p.preco_ref)}` : '';
    return `<button class="prod" data-pid="${esc(p.pid)}"
              aria-current="${p.pid === PV_CURRENT}">
      <span class="n">${esc(p.nome || p.pid)}
        <small>${pvEur(p.preco)}${promo}</small></span>
      <span class="pill ${cls}">${txt}</span>
    </button>`;
  }).join('');
  document.querySelectorAll('.prod').forEach(b =>
    b.onclick = () => pvSelect(b.dataset.pid));
}

async function pvSelect(pid) {
  PV_CURRENT = pid;
  pvRenderList();
  $('#pv-detail').innerHTML = '<div class="empty">a carregar…</div>';
  try {
    pvRenderDetail(await api('/prices/' + encodeURIComponent(pid)));
  } catch (e) {
    $('#pv-detail').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function pvRenderDetail(d) {
  const pts = d.points;
  const last = pts[pts.length - 1] || {};
  const v = d.variacao;
  const vTxt = v == null || pts.length < 2 ? '—' : (v > 0 ? '+' : '') + v + '%';
  const vColor = v == null || v === 0 || pts.length < 2 ? 'var(--muted)'
    : v < 0 ? 'var(--ok)' : 'var(--up)';
  const desconto = last.preco_ref
    ? Math.round(100 * (1 - last.preco / last.preco_ref)) : null;

  $('#pv-detail').innerHTML = `
    <figure>
      <figcaption>
        <h2 class="figure-title">${esc(d.name || d.pid)}</h2>
        <p class="figure-sub">Preço registado ${pts.length === 1 ? 'hoje'
          : `entre ${pts[0].dia} e ${last.dia}`} · id ${esc(d.pid)}</p>
      </figcaption>

      <div class="kpis">
        <div class="kpi"><div class="label">preço atual</div>
          <div class="value">${pvEur(d.atual)}</div></div>
        <div class="kpi"><div class="label">variação no período</div>
          <div class="value small" style="color:${vColor}">${vTxt}</div></div>
        <div class="kpi"><div class="label">mínimo registado</div>
          <div class="value small">${pvEur(d.minimo)}</div></div>
        <div class="kpi"><div class="label">máximo registado</div>
          <div class="value small">${pvEur(d.maximo)}</div></div>
        ${last.preco_ref ? `<div class="kpi"><div class="label">PVPR</div>
          <div class="value small" style="color:var(--ok)">${pvEur(last.preco_ref)}
          <span style="font-size:12px">−${desconto}%</span></div></div>` : ''}
      </div>

      ${pts.some(p => p.preco_ref != null) ? `<div class="legend">
        <span><i></i>preço pago</span>
        <span><i class="ctx"></i>PVPR — só nos dias em promoção</span></div>` : ''}

      <div class="chart-wrap" id="pv-wrap">${pvChart(pts)}<div class="tip" id="pv-tip"></div></div>

      ${pts.length < 2 ? `<div class="note">
        O histórico começa aqui. O continente.pt não publica preços passados — o
        único valor anterior que dá é o PVPR dos produtos em promoção. A partir
        de um segundo registo o gráfico ganha linha.</div>` : ''}

      <details><summary>Ver os números em tabela</summary>
        <table><thead><tr><th>dia</th><th>preço</th><th>PVPR</th><th>por unidade</th></tr></thead>
        <tbody>${pts.slice().reverse().map(p => `<tr>
          <td>${p.dia}</td><td>${pvEur(p.preco)}</td>
          <td>${pvEur(p.preco_ref)}</td><td>${esc(p.preco_unidade || '—')}</td>
        </tr>`).join('')}</tbody></table>
      </details>
    </figure>`;

  if (pts.length) pvWireChart(pts);
}

/* ---- o gráfico, em SVG ------------------------------------------------- */

const PV_M = { t: 18, r: 58, b: 30, l: 46 };   // margem direita p/ o rótulo final
const PV_H = 260;

function pvGeom(pts) {
  const w = Math.max(420, Math.min(760, 90 + pts.length * 46));
  const iw = w - PV_M.l - PV_M.r, ih = PV_H - PV_M.t - PV_M.b;
  const vals = pts.flatMap(p => [p.preco, p.preco_ref].filter(v => v != null));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= Math.max(0.1, lo * 0.06); hi += Math.max(0.1, hi * 0.06); }
  const pad = (hi - lo) * 0.15; lo -= pad; hi += pad;
  const x = i => PV_M.l + (pts.length === 1 ? iw / 2 : (i / (pts.length - 1)) * iw);
  const y = v => PV_M.t + ih - ((v - lo) / (hi - lo)) * ih;
  return { w, iw, ih, lo, hi, x, y };
}

function pvChart(pts) {
  if (!pts.length) return '';
  const g = pvGeom(pts);
  const ticks = 4;
  const gridY = Array.from({ length: ticks + 1 }, (_, i) => g.lo + (i / ticks) * (g.hi - g.lo));

  /* Um traço por troço contínuo de dados. O PVPR só existe nos dias em que o
     produto esteve em promoção; uma única polyline saltaria por cima dos dias
     sem promoção e desenharia uma continuidade que não houve. */
  const segments = sel => {
    const out = []; let run = [];
    pts.forEach((p, i) => {
      if (p[sel] == null) { if (run.length) out.push(run); run = []; }
      else run.push(`${g.x(i)},${g.y(p[sel])}`);
    });
    if (run.length) out.push(run);
    return out;
  };
  const draw = (sel, cls) => segments(sel).map(seg => seg.length > 1
    ? `<polyline class="${cls}" points="${seg.join(' ')}"/>`
    : `<circle class="dot" cx="${seg[0].split(',')[0]}" cy="${seg[0].split(',')[1]}"
               r="3" style="fill:var(--context)"/>`).join('');

  const hasRef = pts.some(p => p.preco_ref != null);
  const last = pts[pts.length - 1];

  // Com um só registo, um ponto sozinho lê-se melhor do que uma linha de zero
  // comprimento; a partir de dois, a linha é a forma certa.
  const serie = pts.length > 1 ? draw('preco', 'serie') : '';
  const ctx = hasRef && pts.length > 1 ? draw('preco_ref', 'ctxline') : '';
  const refDot = hasRef && pts.length === 1
    ? `<line class="ctxline" x1="${PV_M.l}" x2="${g.w - PV_M.r}"
             y1="${g.y(last.preco_ref)}" y2="${g.y(last.preco_ref)}"/>
       <text class="axis" x="${g.w - PV_M.r + 6}" y="${g.y(last.preco_ref) + 4}"
             style="fill:var(--context)">${pvEur(last.preco_ref)}</text>` : '';

  const dots = pts.map((p, i) =>
    `<circle class="dot" cx="${g.x(i)}" cy="${g.y(p.preco)}" r="${pts.length > 20 ? 3.5 : 5}"/>`
  ).join('');

  const labels = pts.map((p, i) => {
    const step = Math.ceil(pts.length / 7);
    return (i % step === 0 || i === pts.length - 1)
      ? `<text class="axis" x="${g.x(i)}" y="${PV_H - 10}" text-anchor="middle">${pvDay(p.dia)}</text>`
      : '';
  }).join('');

  return `<svg width="${g.w}" height="${PV_H}" role="img"
       aria-label="Evolução do preço, ${pts.length} registos">
    <g class="grid">${gridY.map(v =>
      `<line x1="${PV_M.l}" x2="${g.w - PV_M.r}" y1="${g.y(v)}" y2="${g.y(v)}"/>`).join('')}</g>
    <g class="axis">${gridY.map(v =>
      `<text x="${PV_M.l - 8}" y="${g.y(v) + 4}" text-anchor="end">${pvEur(v)}</text>`).join('')}</g>
    ${refDot}${ctx}${serie}${dots}
    <text class="endlabel" x="${g.x(pts.length - 1) + 10}"
          y="${g.y(last.preco) + 4}">${pvEur(last.preco)}</text>
    <g class="axis">${labels}</g>
    <line class="crosshair" id="pv-cross" y1="${PV_M.t}" y2="${PV_H - PV_M.b}" style="display:none"/>
    <rect id="pv-hit" x="${PV_M.l}" y="${PV_M.t}" width="${g.iw}" height="${g.ih}" fill="transparent"/>
  </svg>`;
}

function pvWireChart(pts) {
  const svg = $('#pv-wrap svg'), hit = $('#pv-hit'), cross = $('#pv-cross'), tip = $('#pv-tip');
  if (!svg || !hit) return;
  const g = pvGeom(pts);

  const move = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    let best = 0, bd = Infinity;
    pts.forEach((p, i) => { const d = Math.abs(g.x(i) - px); if (d < bd) { bd = d; best = i; } });
    const p = pts[best];
    cross.style.display = '';
    cross.setAttribute('x1', g.x(best)); cross.setAttribute('x2', g.x(best));
    tip.innerHTML = `${p.dia}<br><b>${pvEur(p.preco)}</b>${
      p.preco_ref ? `<br><span style="color:var(--context)">PVPR ${pvEur(p.preco_ref)}</span>` : ''}${
      p.preco_unidade ? `<br>${esc(p.preco_unidade)}` : ''}`;
    tip.classList.add('on');
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(g.x(best) + 12, g.w - tw - 4)) + 'px';
    tip.style.top = (g.y(p.preco) - 14) + 'px';
  };
  const leave = () => { cross.style.display = 'none'; tip.classList.remove('on'); };

  hit.addEventListener('mousemove', move);
  hit.addEventListener('mouseleave', leave);
  hit.addEventListener('touchmove', move, { passive: true });
  hit.addEventListener('touchend', leave);
}

/* ---- barra de topo ----------------------------------------------------- */

$('#pv-filter').oninput = pvRenderList;
$('#pv-snap').onclick = async () => {
  const b = $('#pv-snap'); b.disabled = true; b.textContent = 'a registar…';
  try {
    const r = await api('/prices/snapshot', { method: 'POST' });
    const extra = r.problems ? ` (${r.problems.length} avisos)` : '';
    $('main').insertAdjacentHTML('beforebegin',
      `<div class="msg" style="max-width:1180px;margin:14px auto 0">
        ${r.recorded} preços registados em ${r.day}${extra}.</div>`);
    setTimeout(() => document.querySelector('.msg')?.remove(), 6000);
    await pvLoad();
    if (PV_CURRENT) pvSelect(PV_CURRENT);
  } catch (e) { alert(e.message); }
  b.disabled = false; b.textContent = 'Registar preços de hoje';
};

/* ---- separadores --------------------------------------------------- */

function mostrar(qual) {
  const precos = qual === 'precos';
  $('#view-lista').hidden = precos;
  $('#view-precos').hidden = !precos;
  $('#tab-lista').setAttribute('aria-selected', String(!precos));
  $('#tab-precos').setAttribute('aria-selected', String(precos));
  document.querySelectorAll('.only-lista').forEach(e => { e.hidden = precos; });
  $('#send').hidden = precos;
  $('#reload').hidden = precos;
  hideTip();
  // Os preços só se vão buscar quando abres o separador.
  if (precos && !PV_PRODUCTS.length) pvLoad();
  try { localStorage.setItem('continente-tab', qual); } catch (e) {}
}

$('#tab-lista').onclick = () => mostrar('lista');
$('#tab-precos').onclick = () => mostrar('precos');

let tabInicial = 'lista';
try { tabInicial = localStorage.getItem('continente-tab') || 'lista'; } catch (e) {}
mostrar(tabInicial);

load();
</script>
